<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="40%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- Core flame path animations -->
    <animateTransform/>
  </defs>

  <!-- Glow base -->
  <ellipse cx="50" cy="100" rx="30" ry="10" fill="#ff6d00" opacity="0.3" filter="url(#blur)">
    <animate attributeName="rx" values="30;35;28;32;30" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.2;0.4;0.3" dur="1.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Outer flame -->
  <path d="M50,105 C25,90 15,70 20,50 C24,35 32,28 38,15 C40,25 36,33 42,40 C44,30 48,18 50,5 C52,18 56,30 58,40 C64,33 60,25 62,15 C68,28 76,35 80,50 C85,70 75,90 50,105 Z"
        fill="url(#fireGlow)" opacity="0.9">
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1,1;1.03,0.98;0.97,1.02;1.02,0.97;1,1"
      dur="0.9s" repeatCount="indefinite" transformOrigin="50 105"/>
    <animate attributeName="d"
      values="M50,105 C25,90 15,70 20,50 C24,35 32,28 38,15 C40,25 36,33 42,40 C44,30 48,18 50,5 C52,18 56,30 58,40 C64,33 60,25 62,15 C68,28 76,35 80,50 C85,70 75,90 50,105 Z;
              M50,105 C23,88 13,68 18,48 C22,33 31,26 37,12 C39,24 35,32 41,39 C43,28 47,16 50,3 C53,16 57,28 59,39 C65,32 61,24 63,12 C69,26 78,33 82,48 C87,68 77,88 50,105 Z;
              M50,105 C27,92 17,72 22,52 C26,37 33,30 39,18 C41,27 37,34 43,41 C45,31 49,20 50,7 C51,20 55,31 57,41 C63,34 59,27 61,18 C67,30 74,37 78,52 C83,72 73,92 50,105 Z;
              M50,105 C25,90 15,70 20,50 C24,35 32,28 38,15 C40,25 36,33 42,40 C44,30 48,18 50,5 C52,18 56,30 58,40 C64,33 60,25 62,15 C68,28 76,35 80,50 C85,70 75,90 50,105 Z"
      dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Mid flame (orange) -->
  <path d="M50,105 C33,92 27,75 30,58 C33,45 40,38 44,27 C46,35 43,42 47,48 C48,38 49,26 50,18 C51,26 52,38 53,48 C57,42 54,35 56,27 C60,38 67,45 70,58 C73,75 67,92 50,105 Z"
        fill="#ff9800" opacity="0.85">
    <animate attributeName="d"
      values="M50,105 C33,92 27,75 30,58 C33,45 40,38 44,27 C46,35 43,42 47,48 C48,38 49,26 50,18 C51,26 52,38 53,48 C57,42 54,35 56,27 C60,38 67,45 70,58 C73,75 67,92 50,105 Z;
              M50,105 C31,90 25,73 28,56 C31,43 38,36 42,24 C44,33 41,40 45,46 C46,36 48,24 50,15 C52,24 54,36 55,46 C59,40 56,33 58,24 C62,36 69,43 72,56 C75,73 69,90 50,105 Z;
              M50,105 C35,93 29,76 32,60 C35,47 42,40 46,30 C48,37 45,44 49,50 C50,40 50,28 50,20 C50,28 50,40 51,50 C55,44 52,37 54,30 C58,40 65,47 68,60 C71,76 65,93 50,105 Z;
              M50,105 C33,92 27,75 30,58 C33,45 40,38 44,27 C46,35 43,42 47,48 C48,38 49,26 50,18 C51,26 52,38 53,48 C57,42 54,35 56,27 C60,38 67,45 70,58 C73,75 67,92 50,105 Z"
      dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.95;0.8;0.9;0.85" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Inner flame (yellow) -->
  <path d="M50,105 C40,95 36,82 38,70 C40,60 45,54 47,46 C48,52 47,57 49,61 C49.5,54 50,45 50,38 C50.5,45 51,54 51,61 C53,57 52,52 53,46 C55,54 60,60 62,70 C64,82 60,95 50,105 Z"
        fill="#fff176" opacity="0.9">
    <animate attributeName="d"
      values="M50,105 C40,95 36,82 38,70 C40,60 45,54 47,46 C48,52 47,57 49,61 C49.5,54 50,45 50,38 C50.5,45 51,54 51,61 C53,57 52,52 53,46 C55,54 60,60 62,70 C64,82 60,95 50,105 Z;
              M50,105 C38,93 34,80 36,68 C38,58 43,52 45,43 C46,50 45,55 48,59 C48.5,52 49,42 50,35 C51,42 51.5,52 52,59 C55,55 54,50 55,43 C57,52 62,58 64,68 C66,80 62,93 50,105 Z;
              M50,105 C42,96 38,84 40,72 C42,62 47,56 49,49 C50,54 49,59 50,63 C50,56 50,47 50,41 C50,47 50,56 50,63 C51,59 50,54 51,49 C53,56 58,62 60,72 C62,84 58,96 50,105 Z;
              M50,105 C40,95 36,82 38,70 C40,60 45,54 47,46 C48,52 47,57 49,61 C49.5,54 50,45 50,38 C50.5,45 51,54 51,61 C53,57 52,52 53,46 C55,54 60,60 62,70 C64,82 60,95 50,105 Z"
      dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- Sparks -->
  <circle cx="38" cy="30" r="2" fill="#ffeb3b" opacity="0">
    <animate attributeName="cy" values="80;20;10" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="cx" values="38;34;30" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="r" values="2;1.5;0.5" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="62" cy="35" r="1.5" fill="#ffeb3b" opacity="0">
    <animate attributeName="cy" values="75;25;12" dur="1.1s" repeatCount="indefinite" begin="0.7s"/>
    <animate attributeName="cx" values="62;67;70" dur="1.1s" repeatCount="indefinite" begin="0.7s"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="1.1s" repeatCount="indefinite" begin="0.7s"/>
    <animate attributeName="r" values="1.5;1;0.3" dur="1.1s" repeatCount="indefinite" begin="0.7s"/>
  </circle>
  <circle cx="50" cy="20" r="1.8" fill="#fff9c4" opacity="0">
    <animate attributeName="cy" values="70;15;5" dur="1.6s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cx" values="50;46;44" dur="1.6s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>
